on:
  push:
    paths:
      - "races.csv"
      - "generate_ics.py"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate calendar.ics
        run: python3 generate_ics.py

      - name: Commit updated calendar.ics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto-regenerate calendar.ics"
          git push
